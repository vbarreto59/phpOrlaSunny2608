<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnyImob | Teste de Envio de E-mail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff9f43;
            text-align: center;
            margin-bottom: 20px;
            display: block;
            text-decoration: none;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }

        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #ff9f43;
            outline: none;
        }

        .btn {
            width: 100%;
            background-color: #ff9f43;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #ee5253;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="#" class="logo">☀️ SunnyImob</a>
        <h2>Teste de Disparo de E-mail</h2>

        <form action="enviar.php" method="POST">
            <div class="form-group">
                <label for="nome">Seu Nome (Remetente)</label>
                <input type="text" id="nome" name="nome" value="Suporte SunnyImob" required>
            </div>

            <div class="form-group">
                <label for="assunto">Assunto do Teste</label>
                <input type="text" id="assunto" name="assunto" value="Teste de Monitoramento de E-mail" required>
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5" required>Olá, este é um e-mail de teste automatizado enviado pelo sistema da SunnyImob.</textarea>
            </div>

            <button type="submit" class="btn">Enviar E-mail de Teste</button>
        </form>
    </div>

</body>
</html>
